name: Android Build Release Workflow

on:
  push:
    #branches: [ dev ]
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-overwrite-existing: true

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BRAVEPIPE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bravepipe-release.keystore"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/bravepipe-release.keystore
          storePassword=${{ secrets.BRAVEPIPE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.BRAVEPIPE_KEY_ALIAS }}
          keyPassword=${{ secrets.BRAVEPIPE_KEY_PASSWORD }}
          EOF

      - name: generate ChangeLog
        run: |
          git show --no-patch HEAD  --format='%B' > customChangeLogFile

      - name: Rename strings from NewPipe to BravePipe
        run: ./gradlew bravify

      - name: Build brave flavor
        run: ./gradlew assembleBraveRelease

      - name: Build braveConscrypt flavor
        run: ./gradlew assembleBraveConscryptRelease

      - name: Setup build tool version variable
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" | sort -V | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo Last build tool version is: $BUILD_TOOL_VERSION

      # evermind: How to get just the tag name? -> https://github.community/t/how-to-get-just-the-tag-name/16241/11
      - name: Branch name
        id: branch_name
        run: |
          echo "SOURCE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      # evermind
      - name: rename apk and create checksum
        id: renamed_apk
        env:
          SOURCE_TAG: ${{ steps.branch_name.outputs.SOURCE_TAG }}
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -1)
          mkdir -p dist

          BRAVE_APK=$(find app/build/outputs/apk/brave/release -maxdepth 1 -name '*.apk' | head -1)
          test -n "$BRAVE_APK"
          "$APKSIGNER" verify --print-certs "$BRAVE_APK"
          cp "$BRAVE_APK" "dist/BravePipe_${SOURCE_TAG}.apk"
          (cd dist && sha256sum "BravePipe_${SOURCE_TAG}.apk" > "BravePipe_${SOURCE_TAG}.apk.sha256")
          echo "RENAMED_APK=dist/BravePipe_${SOURCE_TAG}.apk" >> $GITHUB_OUTPUT

          CONSCRYPT_APK=$(find app/build/outputs/apk/braveConscrypt/release -maxdepth 1 -name '*.apk' | head -1)
          test -n "$CONSCRYPT_APK"
          "$APKSIGNER" verify --print-certs "$CONSCRYPT_APK"
          cp "$CONSCRYPT_APK" "dist/BravePipe_conscrypt_${SOURCE_TAG}.apk"
          (cd dist && sha256sum "BravePipe_conscrypt_${SOURCE_TAG}.apk" > "BravePipe_conscrypt_${SOURCE_TAG}.apk.sha256")
          echo "RENAMED_APK_CONSCRYPT=dist/BravePipe_conscrypt_${SOURCE_TAG}.apk" >> $GITHUB_OUTPUT

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: brave-release-${{ steps.branch_name.outputs.SOURCE_TAG }}
          path: dist/*

      # evermind: how to autorelease?: https://github.com/marvinpinto/action-automatic-releases
      - name: auto release
        uses: "evermind-zz/action-automatic-releases@v1.2.1-evrmd"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          changelog_file: "customChangeLogFile"
          files: |
            ${{ steps.renamed_apk.outputs.RENAMED_APK }}
            ${{ steps.renamed_apk.outputs.RENAMED_APK }}.sha256
            ${{ steps.renamed_apk.outputs.RENAMED_APK_CONSCRYPT }}
            ${{ steps.renamed_apk.outputs.RENAMED_APK_CONSCRYPT }}.sha256
        id: "automatic_releases"
      - name: "Automatically update json api data repository"
        continue-on-error: true
        env:
          GITHUB_SUPER_TOKEN: ${{ secrets.MY_GITHUB_SUPER_TOKEN }}
          RENAMED_APK: ${{ steps.renamed_apk.outputs.RENAMED_APK }}
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}
        run: |
          ./.github/scripts/brave-new-pipe-releast-actions.sh "$AUTOMATIC_RELEASES_TAG" "${RENAMED_APK}" "customChangeLogFile"
